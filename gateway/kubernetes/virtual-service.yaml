apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: millisecond-virtualservice
  namespace: default
spec:
  hosts:
  - "api.yolang.shop"
  gateways:
  - millisecond-gateway
  http:
  - match:
    - uri:
        prefix: /users
    route:
    - destination:
        host: userservice.default.svc.cluster.local
        port:
          number: 8080

  - match:
    - uri:
        prefix: /usage
    route:
    - destination:
        host: usageservice.default.svc.cluster.local
        port:
          number: 8080

  # InsightService
  - match:
    - uri:
        prefix: /insights
    route:
    - destination:
        host: insightservice.default.svc.cluster.local
        port:
          number: 8080

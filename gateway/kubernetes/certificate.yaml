apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: millisecond-cert
  namespace: istio-system  # ⚠️ Istio Ingress Gateway가 접근할 수 있는 namespace
spec:
  # 생성될 TLS Secret의 이름 (Gateway에서 참조)
  secretName: millisecond-tls

  # 어떤 ClusterIssuer를 사용할지
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

  # 인증서를 발급받을 도메인
  dnsNames:
  - api.yolang.shop

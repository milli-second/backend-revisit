server:
  port: 8088

spring:
  cloud:
    gateway:
      routes:
        - id: userservice
          uri: ${USERSERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/users/**
        - id: usageservice
          uri: ${USAGESERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/usage/**
        - id: insightservice
          uri: ${INSIGHTSERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/insights/**
        - id: frontend
          uri: ${FRONTEND_URI:http://localhost:8080}
          predicates:
            - Path=/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

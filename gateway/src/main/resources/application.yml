server:
  port: 8088

jwt:
  secret: ${JWT_SECRET_KEY}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # Swagger 문서 접근 (인증 불필요)
        - id: usageservice-docs
          uri: ${USAGESERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/usage/v3/api-docs/**,/usage/swagger-ui/**,/usage/swagger-ui.html
        - id: insightservice-docs
          uri: ${INSIGHTSERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/insights/v3/api-docs/**,/insights/swagger-ui/**,/insights/swagger-ui.html

        # 일반 API 접근 (JWT 인증 필요)
        - id: userservice
          uri: ${USERSERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/users/**
        - id: usageservice
          uri: ${USAGESERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/usage/**
          filters:
            - JwtAuthenticationFilter
        - id: insightservice
          uri: ${INSIGHTSERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/insights/**
          filters:
            - JwtAuthenticationFilter
#        - id: frontend
#          uri: ${FRONTEND_URI:http://localhost:8080}
#          predicates:
#            - Path=/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /users/v3/api-docs
      - name: Usage Service
        url: /usage/v3/api-docs
      - name: Insight Service
        url: /insights/v3/api-docs

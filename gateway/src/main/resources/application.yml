server:
  port: 8088

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: userservice
          uri: ${USERSERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/users/**
        - id: usageservice
          uri: ${USAGESERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/usage/**
        - id: insightservice
          uri: ${INSIGHTSERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/insights/**
#        - id: frontend
#          uri: ${FRONTEND_URI:http://localhost:8080}
#          predicates:
#            - Path=/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /users/v3/api-docs
      - name: Usage Service
        url: /usage/v3/api-docs
      - name: Insight Service
        url: /insights/v3/api-docs

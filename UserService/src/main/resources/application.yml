spring:
  application:
    name: userservice

  data:
    redis:
      host: localhost
      port: 6379
      database: 0   # userService 인증용 Redis DB index
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  datasource:
    url: jdbc:postgresql://localhost:5432/userservice
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

#  kafka:
#    bootstrap-servers: localhost:9092
#    producer:
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
#      properties:
#        spring.json.use.type.headers: false # 순수 JSON 발행을 위해 타입 헤더 사용 비활성화
#    consumer:
#      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      properties:
#        spring.json.trusted.packages: "*"
#    properties:
#      security.protocol: PLAINTEXT



  cloud:
    stream:
      bindings:
        produceSignedUp:
          destination: user_signup
          contentType: application/json
        produceLoggedOut:
          destination: user_logout
          contentType: application/json
        produceLoggedIn:
          destination: user_login
          contentType: application/json
        produceNicknameChanged:
          destination: user_nickname_changed
          contentType: application/json
        producePasswordChanged:
          destination: user_password_changed
          contentType: application/json
        produceAccountDeactivated:
          destination: user_deactivated
          contentType: application/json
      kafka:
        binder:
          brokers: localhost:9092
          configuration:
            security.protocol: PLAINTEXT

logging:
  level:
    org.hibernate.type: trace
    org.springframework.kafka: debug

jwt:
  secret: ${JWT_SECRET_KEY:my-default-secret7e9f3b4c5d7c5d8e4f12a9ec17f1f4d29c6b1f8a2}

springdoc:
  api-docs:
    path: /users/v3/api-docs
  swagger-ui:
    path: /users/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

---
# 로컬 개발 환경
spring:
  config:
    activate:
      on-profile: default

server:
  port: 8081

---
# Docker/Kubernetes 환경
spring:
  config:
    activate:
      on-profile: docker

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis.db.svc.cluster.local}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:userservice-postgres.db.svc.cluster.local}:5432/userservice
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

  kafka:
    bootstrap-servers: kafka-0.kafka.db.svc.cluster.local:9092
    #bootstrap-servers: my-kafka:9092
    properties:
      security.protocol: PLAINTEXT

server:
  port: 8080







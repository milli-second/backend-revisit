spring:
  application:
    name: userservice

  data:
    redis:
      host: localhost
      port: 6379
      database: 0   # userService 인증용 Redis DB index

  datasource:
    url: jdbc:postgresql://localhost:5432/userservice
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

  cloud:
    stream:
      bindings:
        eventProducer-out-0:
          destination: user_signup
          contentType: application/json
        eventProducer-out-1:
          destination: user_logout
          contentType: application/json
        eventProducer-out-2:
          destination: user_login
          contentType: application/json
        eventProducer-out-3:
          destination: user_password_changed
          content-type: application/json
        eventProducer-out-4:
          destination: user_deactivated
          content-type: application/json

logging:
  level:
    org.hibernate.type: trace
    org.springframework.kafka: debug

jwt:
  secret: ${JWT_SECRET_KEY:my-default-secret7e9f3b4c5d7c5d8e4f12a9ec17f1f4d29c6b1f8a2}

springdoc:
  api-docs:
    path: /users/v3/api-docs
  swagger-ui:
    path: /users/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

---
# 로컬 개발 환경
spring:
  config:
    activate:
      on-profile: default

server:
  port: 8081

---
# Docker/Kubernetes 환경
spring:
  config:
    activate:
      on-profile: docker

  data:
    redis:
      host: redis
      port: 6379

  datasource:
    url: jdbc:postgresql://userservice-db:5432/userservice

  kafka:
    bootstrap-servers: my-kafka:9092

server:
  port: 8080







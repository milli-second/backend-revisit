server:
  port: 8081

spring:
  application:
    name: userservice
  data:
    redis:
      #host: 210.178.40.108
      host: localhost
      port: 6379
      database: 0   # userService 인증용 Redis DB index

  datasource:
    #url: jdbc:postgresql://localhost:5432/userservice
    #url: jdbc:postgresql://localhost:5433/userservice
    #url: jdbc:postgresql://210.178.40.108:5432/userservice
    url: jdbc:postgresql://210.178.40.108:30032/userservice
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update   # ddl-auto는 properties 안이 아니라 hibernate 아래
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      #value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      #value-deserializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.trusted.packages: "*"

  cloud:
    stream:
      bindings:
        eventProducer-out-0:
          destination: user_signup
          contentType: application/json
        eventProducer-out-1:
          destination: user_logout
          contentType: application/json
        eventProducer-out-2:
          destination: user_login
          contentType: application/json
        eventProducer-out-3:
          destination: user_password_changed
          content-type: application/json
        eventProducer-out-4:
            destination: user_deactivated
            content-type: application/json

logging:
  level:
    org.hibernate.type: trace
    org.springframework.kafka: debug

jwt:
  secret: ${JWT_SECRET_KEY:my-default-secret7e9f3b4c5d7c5d8e4f12a9ec17f1f4d29c6b1f8a2}







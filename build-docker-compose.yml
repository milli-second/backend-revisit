version: '3.8'
services:
  userservice-db:
    image: postgres:16
    container_name: userservice-db
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - userservice_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  usageservice-db:
    image: timescale/timescaledb:latest-pg16
    container_name: usageservice-db
    environment:
      POSTGRES_DB: usageservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - usageservice_data:/var/lib/postgresql/data
      - ./init-scripts/usageservice:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  insightservice-db:
    image: postgres:16
    container_name: insightservice-db
    environment:
      POSTGRES_DB: insightservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - insightservice_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: my-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft 모드 필수 설정
      CLUSTER_ID: "kraft-cluster-01"
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@my-kafka:9093"

      # 리스너 설정
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://my-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 기타 필수 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.log=WARN,org.apache.kafka.controller=WARN,kafka.request.logger=INFO"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "INFO"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  gateway:
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      userservice:
        condition: service_started
      usageservice:
        condition: service_started
      insightservice:
        condition: service_started
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - USERSERVICE_URI=http://userservice:8080
      - USAGESERVICE_URI=http://usageservice:8080
      - INSIGHTSERVICE_URI=http://insightservice:8080
    ports:
      - "8088:8088"

  userservice:
    depends_on:
      - kafka
      - userservice-db
      - redis
    build:
      context: ./UserService
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - REDIS_HOST=redis
      - POSTGRES_HOST=userservice-db
    ports:
      - "8081:8080"

  insightservice:
    depends_on:
      - kafka
      - insightservice-db
    build:
      context: ./InsightService
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_HOST=insightservice-db
    ports:
      - "8083:8080"

  usageservice:
    depends_on:
      - kafka
      - usageservice-db
      - redis
    build:
      context: ./UsageService
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - REDIS_HOST=redis
      - POSTGRES_HOST=usageservice-db
    ports:
      - "8082:8080"

volumes:
  userservice_data:
  usageservice_data:
  insightservice_data:
  redis_data:
  kafka-data:


x-kafka-env: &kafka-env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: my-kafka:29092            # spring.kafka.bootstrap-servers
  SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: my-kafka:29092  # spring.cloud.stream.kafka.binder.brokers

services:
  userservice-db:
    image: postgres:15-alpine
    container_name: userservice-db
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - userservice_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  usageservice-db:
    image: timescale/timescaledb:latest-pg15
    container_name: usageservice-db
    environment:
      POSTGRES_DB: usageservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - usageservice_data:/var/lib/postgresql/data
      - ./init-scripts/usageservice:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  insightservice-db:
    image: postgres:15-alpine
    container_name: insightservice-db
    environment:
      POSTGRES_DB: insightservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - insightservice_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # k8s/databases/kafka.yaml과 같은 구성 (cp-kafka 7.5.0 + ZooKeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      # 이미지가 data·log를 각각 VOLUME으로 선언하므로 둘 다 붙여야 재시작해도 클러스터 ID가 유지된다
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: my-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 리스너 두 개: 컨테이너끼리는 INTERNAL(my-kafka:29092), Mac에서 bootRun한 앱은 EXTERNAL(localhost:9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://my-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  gateway:
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      userservice:
        condition: service_started
      usageservice:
        condition: service_started
      insightservice:
        condition: service_started
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - USERSERVICE_URI=http://userservice:8080
      - USAGESERVICE_URI=http://usageservice:8080
      - INSIGHTSERVICE_URI=http://insightservice:8080
    ports:
      - "8088:8088"

  userservice:
    depends_on:
      - kafka
      - userservice-db
      - redis
    build:
      context: .
      dockerfile: UserService/Dockerfile
    environment:
      <<: *kafka-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      POSTGRES_HOST: userservice-db
      SPRING_JPA_HIBERNATE_DDL_AUTO: update   # Flyway 도입 전까지 로컬 compose 한정
    ports:
      - "8081:8080"

  insightservice:
    depends_on:
      - kafka
      - insightservice-db
    build:
      context: .
      dockerfile: InsightService/Dockerfile
    environment:
      <<: *kafka-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://insightservice-db:5432/insightservice
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8083:8080"

  usageservice:
    depends_on:
      - kafka
      - usageservice-db
      - redis
    build:
      context: .
      dockerfile: UsageService/Dockerfile
    environment:
      <<: *kafka-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ""
      POSTGRES_HOST: usageservice-db
    ports:
      - "8082:8080"

volumes:
  userservice_data:
  usageservice_data:
  insightservice_data:
  redis_data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:


apiVersion: v1
kind: ConfigMap
metadata:
  name: userservice-config
  namespace: screentimeai
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://userservice-postgres-0.userservice-postgres.db.svc.cluster.local:5432/userservice_db"
  SPRING_DATA_REDIS_HOST: "redis-0.redis.db.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "0"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka.db.svc.cluster.local:9092"
  SPRINGDOC_SWAGGER_UI_SERVER_URL: "http://__SERVER_IP__:30088"
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: screentimeai
spec:
  selector:
    app: userservice
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: screentimeai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
      - name: userservice
        image: laylaoh/userservice:latest-amd64
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: userservice-config
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: userservice-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: userservice-db-secret
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: userservice-db-secret
              key: POSTGRES_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: userservice-config
              key: SPRING_DATA_REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: userservice-config
              key: SPRING_DATA_REDIS_PORT
        - name: SPRING_DATA_REDIS_DATABASE
          valueFrom:
            configMapKeyRef:
              name: userservice-config
              key: SPRING_DATA_REDIS_DATABASE
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: userservice-config
              key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        - name: JWT_SECRET_KEY
          value: "my-jwt-secret-key-change-in-production-7e9f3b4c5d7c5d8e4f12a9ec17f1f4d29c6b1f8a2"
        - name: SPRINGDOC_SWAGGER_UI_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: userservice-config
              key: SPRINGDOC_SWAGGER_UI_SERVER_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10


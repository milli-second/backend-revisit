apiVersion: v1
kind: Service
metadata:
  name: usageservice-postgres
  namespace: db
spec:
  clusterIP: None  # Headless Service for StatefulSet
  selector:
    app: usageservice-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: usageservice-postgres
  namespace: db
spec:
  serviceName: usageservice-postgres
  replicas: 1
  selector:
    matchLabels:
      app: usageservice-postgres
  template:
    metadata:
      labels:
        app: usageservice-postgres
    spec:
      containers:
      - name: postgres
        image: timescale/timescaledb:latest-pg15  # TimescaleDB for time-series data
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: usageservice-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: usageservice-db-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: usageservice-db-secret
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: init-sql
        configMap:
          name: usageservice-postgres-init-cm
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: ktc-nfs-client
      resources:
        requests:
          storage: 10Gi

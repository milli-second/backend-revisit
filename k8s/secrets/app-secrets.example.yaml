# namespace screentimeai 의 Secret 목록. 복사해서 app-secrets.yaml 로 값을 채운다 (커밋 금지, .gitignore 대상).
#   cp k8s/secrets/app-secrets.example.yaml k8s/secrets/app-secrets.yaml
# jwt-secret 하나를 gateway와 userservice가 함께 참조한다. 값이 갈라지면 전 요청이 401.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: screentimeai
stringData:
  JWT_SECRET_KEY: ""   # openssl rand -hex 32
---
apiVersion: v1
kind: Secret
metadata:
  name: userservice-db-secret
  namespace: screentimeai
stringData:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: usageservice-db-secret
  namespace: screentimeai
stringData:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: insightservice-db-secret
  namespace: screentimeai
stringData:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: screentimeai
stringData:
  REDIS_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: screentimeai
stringData:
  OPENAI_API_KEY: ""

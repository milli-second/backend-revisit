# namespace db 의 Secret 목록. 복사해서 db-secrets.yaml 로 값을 채운다 (커밋 금지, .gitignore 대상).
#   cp k8s/secrets/db-secrets.example.yaml k8s/secrets/db-secrets.yaml
# DB 계정은 screentimeai 쪽(app-secrets)과 같은 값이어야 한다. Secret은 네임스페이스를 넘지 못해 두 벌을 둔다.
apiVersion: v1
kind: Secret
metadata:
  name: userservice-db-secret
  namespace: db
stringData:
  POSTGRES_DB: userservice
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: usageservice-db-secret
  namespace: db
stringData:
  POSTGRES_DB: usageservice
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: insightservice-db-secret
  namespace: db
stringData:
  POSTGRES_DB: insightservice
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: db
stringData:
  REDIS_PASSWORD: ""

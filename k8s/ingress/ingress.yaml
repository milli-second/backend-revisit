apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress-tls
  namespace: nginx-ingress
  annotations:
    nginx.org/redirect-to-https: "True"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.yolang.shop
      secretName: api-yolang-shop-tls
  rules:
    - host: api.yolang.shop
      http:
        paths:
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088
          - path: /usage
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088
          - path: /insights
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088
          - path: /webjars
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088
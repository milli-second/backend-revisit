apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: screentimeai
  annotations:
    # --- NGINX Ingress 기본 설정 ---
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.org/client-max-body-size: "50m"

    # --- cert-manager 설정 ---
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # --- 보안: .git 접근 차단 ---
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~ /\.git {
        deny all;
        return 404;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.yolang.shop
      secretName: api-yolang-shop-tls

  rules:
    - host: api.yolang.shop
      http:
        paths:
          # ✅ Gateway 전체 트래픽 라우팅
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088

          # ✅ Swagger UI & 관련 리소스 경로
          - path: /swagger-ui.html
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  number: 8088

          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088

          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088

          - path: /webjars
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8088

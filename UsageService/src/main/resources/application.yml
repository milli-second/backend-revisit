spring:
  application:
    name: usageservice

  datasource:
    url: jdbc:postgresql://localhost:5433/usageservice
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

  cloud:
    stream:
      bindings:
        screenData-out-0:
          destination: usage_events
          contentType: application/json
      kafka:
        binder:
          brokers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379
      database: 1

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

---
# 로컬 개발 환경
spring:
  config:
    activate:
      on-profile: default

server:
  port: 8082

---
# Docker/Kubernetes 환경
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://usageservice-db:5432/usageservice

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    stream:
      kafka:
        binder:
          brokers: my-kafka:9092

server:
  port: 8080

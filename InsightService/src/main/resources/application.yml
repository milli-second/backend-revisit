spring:
  application:
    name: insightservice

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: insightservice
          destination: screentimeai
          contentType: application/json
        event-out:
          destination: screentimeai
          contentType: application/json

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug

---
# 로컬 개발 환경
spring:
  config:
    activate:
      on-profile: default

server:
  port: 8083

---
# Docker/Kubernetes 환경
spring:
  config:
    activate:
      on-profile: docker

server:
  port: 8080

  cloud:
    stream:
      kafka:
        binder:
          brokers: kafka:9092



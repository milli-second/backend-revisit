name: Push to GitLab

on:
  push:
    branches:
      - main  # GitHub에서 푸시되는 브랜치 이름

jobs:
  push_to_gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Git config
        run: |
          git config --global user.name "hkkim2021"
          git config --global user.email "khk990619@gmail.com"

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/layla7120-group/backend.git
          git push gitlab main --force
